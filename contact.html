<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Rubén Domínguez-Díaz</title>
<link rel="stylesheet" href="style.css">
<script>(function(){try{var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a class="brand" href="index.html">Rubén Domínguez-Díaz</a>
    <div class="menu">
      <a href="index.html">Home</a>
      <a href="contact.html" class="here">Contact</a>
      <button id="theme-toggle" type="button" aria-label="Switch between light and dark">☼</button>
    </div>
  </div>
</nav>

<main>
  <section class="page">
    <h1>Contact</h1>
    <p><a href="mailto:dominguezdiazruben@gmail.com">dominguezdiazruben@gmail.com</a></p>

      Banco de España<br>

  </section>
</main>

<footer>
  <div>The views expressed on this site are my own and do not necessarily
  represent those of the Banco de España or the Eurosystem.</div>
</footer>

<script>
(function () {
  var root = document.documentElement, btn = document.getElementById("theme-toggle");
  function current() {
    return root.getAttribute("data-theme") ||
      (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  }
  function paint() { btn.textContent = current() === "dark" ? "☼" : "☾"; }
  paint();
  btn.addEventListener("click", function () {
    var next = current() === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch (e) {}
    paint();
  });
})();
</script>
</body>
</html>
